<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Odómetro Residuo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      text-align: center;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #161b22;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .status-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f85149;
      margin-right: 6px;
    }
    .status-badge.ok {
      background: #2ea043;
    }
    .presets-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-preset {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
    }
    .btn-preset.active {
      background: #1f6feb;
      color: #fff;
      border-color: #58a6ff;
    }
    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .input-group {
      background: #161b22;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #30363d;
    }
    .input-group label {
      display: block;
      font-size: 11px;
      color: #8b949e;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .input-group input {
      width: 100%;
      background: transparent;
      border: none;
      color: #58a6ff;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      outline: none;
    }
    .display-box {
      margin: 16px 0;
      padding: 24px 12px;
      background: #161b22;
      border-radius: 16px;
      border: 2px solid #30363d;
      transition: background 0.2s, border-color 0.2s;
    }
    .display-box.librado {
      background: #0f5323 !important;
      border-color: #2ea043 !important;
      box-shadow: 0 0 30px rgba(46, 160, 67, 0.4);
    }
    .counter-value {
      font-size: 80px;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
    }
    .counter-unit {
      font-size: 20px;
      color: #8b949e;
      margin-top: 4px;
    }
    .target-info {
      margin-top: 10px;
      font-size: 15px;
      color: #c9d1d9;
    }
    .progress-track {
      background: #30363d;
      border-radius: 8px;
      height: 14px;
      width: 100%;
      margin-top: 14px;
      overflow: hidden;
    }
    .progress-fill {
      background: #1f6feb;
      height: 100%;
      width: 0%;
      transition: width 0.3s linear;
    }
    .progress-fill.done {
      background: #2ea043;
    }
    .btn-reset {
      background: #da3633;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 22px 10px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 6px 18px rgba(218, 54, 51, 0.4);
    }
    .btn-reset:active {
      transform: scale(0.97);
      background: #b62324;
    }
    .diag-msg {
      font-size: 11px;
      color: #f85149;
      margin-top: 6px;
      min-height: 14px;
    }
  </style>
</head>
<body>

  <div class="status-bar">
    <div>
      <span class="status-badge" id="gpsBadge"></span>
      <span id="gpsText">Iniciando GPS...</span>
    </div>
    <div id="speedText">0 km/h</div>
  </div>

  <div class="diag-msg" id="diagMsg"></div>

  <div class="presets-container">
    <button class="btn-preset active" onclick="setPreset(180, this)">130 SIMPLE (180m)</button>
    <button class="btn-preset" onclick="setPreset(360, this)">130 DOBLE (360m)</button>
  </div>

  <div class="inputs-grid">
    <div class="input-group">
      <label>Longitud Tren (m)</label>
      <input type="number" id="trainLength" value="180" oninput="updateCalculations()">
    </div>
    <div class="input-group">
      <label>Margen Seg. (m)</label>
      <input type="number" id="safetyMargin" value="20" oninput="updateCalculations()">
    </div>
  </div>

  <div class="display-box" id="displayBox">
    <div class="counter-value" id="distCount">0</div>
    <div class="counter-unit">METROS RECORRIDOS</div>
    <div class="target-info" id="targetText">Objetivo: 200 m (180 + 20)</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>

  <button class="btn-reset" onclick="triggerReset()">
    MARCAR PUNTO (RESET)
  </button>

  <script>
    let watchId = null;
    let lastPosition = null;
    let totalDistance = 0;
    let isTracking = false;
    let hasAlerted = false;
    let audioCtx = null;

    function playBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {
        console.error(e);
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function initGPS() {
      const diagMsg = document.getElementById('diagMsg');
      const badge = document.getElementById('gpsBadge');
      const gpsText = document.getElementById('gpsText');

      if (!navigator.geolocation) {
        diagMsg.innerText = "Error: Este navegador no soporta geolocalización.";
        return;
      }

      if (window.location.protocol === 'file:') {
        diagMsg.innerText = "AVISO: Archivo local (file://). Ábrelo mediante HTTPS o un servidor web para que el GPS funcione.";
      }

      const options = {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      };

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          diagMsg.innerText = "";
          badge.className = "status-badge ok";
          const acc = Math.round(pos.coords.accuracy);
          gpsText.innerText = `GPS Activo (±${acc}m)`;

          const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
          document.getElementById('speedText').innerText = `${speedKmh} km/h`;

          if (isTracking && lastPosition) {
            const stepDist = calculateDistance(
              lastPosition.coords.latitude,
              lastPosition.coords.longitude,
              pos.coords.latitude,
              pos.coords.longitude
            );
            if (stepDist > 0.4) {
              totalDistance += stepDist;
              updateUI();
            }
          }
          lastPosition = pos;
        },
        (err) => {
          badge.className = "status-badge";
          let razon = "Error desconocido";
          if (err.code === 1) razon = "Permiso denegado por el usuario";
          if (err.code === 2) razon = "Posición no disponible (sin satélites)";
          if (err.code === 3) razon = "Tiempo de espera agotado";
          gpsText.innerText = "Sin señal GPS";
          diagMsg.innerText = `${razon}. Asegúrate de dar permisos de ubicación y tener cielo abierto.`;
        },
        options
      );
    }

    function triggerReset() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      totalDistance = 0;
      isTracking = true;
      hasAlerted = false;
      updateUI();
    }

    function getTargetDistance() {
      const train = parseFloat(document.getElementById('trainLength').value) || 0;
      const margin = parseFloat(document.getElementById('safetyMargin').value) || 0;
      return train + margin;
    }

    function updateCalculations() {
      const train = parseFloat(document.getElementById('trainLength').value) || 0;
      const margin = parseFloat(document.getElementById('safetyMargin').value) || 0;
      const target = train + margin;
      document.getElementById('targetText').innerText = `Objetivo: ${target} m (${train} + ${margin})`;
      updateUI();
    }

    function setPreset(meters, btn) {
      document.getElementById('trainLength').value = meters;
      document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateCalculations();
    }

    function updateUI() {
      const target = getTargetDistance();
      const current = Math.floor(totalDistance);
      document.getElementById('distCount').innerText = current;

      const displayBox = document.getElementById('displayBox');
      const progressBar = document.getElementById('progressBar');

      let pct = target > 0 ? (totalDistance / target) * 100 : 0;
      progressBar.style.width = `${Math.min(pct, 100)}%`;

      if (totalDistance >= target && target > 0) {
        displayBox.classList.add('librado');
        progressBar.classList.add('done');
        if (!hasAlerted) {
          playBeep();
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          hasAlerted = true;
        }
      } else {
        displayBox.classList.remove('librado');
        progressBar.classList.remove('done');
      }
    }

    window.addEventListener('load', () => {
      initGPS();
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
      }
    });
  </script>
</body>
</html>
